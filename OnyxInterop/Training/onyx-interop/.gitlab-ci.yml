# Abacus/Onyx Healthcare Interop — GitLab CI/CD
# Stages: validate → test → security → build → deploy-stage → deploy-prod

stages:
  - validate
  - test
  - security
  - build
  - deploy-stage
  - deploy-prod

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "."
  FHIR_OUTPUT: "fhir_output"

default:
  image: python:3.12-slim
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - .venv/

.python_setup: &python_setup
  before_script:
    - python -m venv .venv
    - .venv/bin/pip install -q -r requirements.txt

# --- VALIDATE ---
lint:python:
  stage: validate
  <<: *python_setup
  script:
    - .venv/bin/python -m compileall pipeline/ observability/ monitoring/ -q
    - .venv/bin/python -c "import yaml; [yaml.safe_load(open(p)) for p in ['configs/mdp/services.json']]"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

validate:configs:
  stage: validate
  <<: *python_setup
  script:
    - .venv/bin/python scripts/validate_fhir_output.py --help
    - test -f configs/mdp/ig_registry.json
    - test -f configs/mdp/services.json
    - test -f configs/workflows/claims/extract_config.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

terraform:validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  script:
    - cd terraform
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

helm:lint:
  stage: validate
  image: alpine/helm:3.14.0
  script:
    - helm lint helm/firely-server/
    - helm template firely helm/firely-server/ -f helm/firely-server/values.yaml > /dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

databricks:bundle-validate:
  stage: validate
  image: python:3.12-slim
  script:
    - pip install -q databricks-cli
    - |
      if [ -f databricks.yml ]; then
        pip install -q databricks-bundles 2>/dev/null || true
        databricks bundle validate -t dev 2>/dev/null || echo "Bundle validate skipped (CLI/auth)"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# --- TEST ---
test:unit:
  stage: test
  <<: *python_setup
  script:
    - .venv/bin/python -m pytest tests/ -v --tb=short --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:fhir-baseline:
  stage: test
  <<: *python_setup
  script:
    - .venv/bin/python interop_pipeline.py --input ./source_data --output ./fhir_output
    - .venv/bin/python scripts/validate_fhir_output.py ./fhir_output
    - |
      COUNT=$(find ./fhir_output -name '*.json' | wc -l | tr -d ' ')
      echo "FHIR files: $COUNT"
      test "$COUNT" -gt 0
  artifacts:
    paths:
      - fhir_output/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# --- SECURITY ---
security:phi-scan:
  stage: security
  <<: *python_setup
  script:
    - |
      ! grep -rEn '(member_ssn|patient_name|date_of_birth).*=.*["'\''][0-9]{3}-' pipeline/ configs/ --include='*.py' --include='*.yaml' 2>/dev/null || true
      echo "PHI literal scan complete"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

security:secrets-scan:
  stage: security
  image: alpine:3.19
  script:
    - apk add --no-cache git grep
    - |
      ! git grep -E '(AKIA[0-9A-Z]{16}|password\s*=\s*["'\''][^"'\'' ]+["'\''])' -- ':!*.md' ':!.gitlab-ci.yml' 2>/dev/null || \
        (echo "Potential secret found — review required" && exit 1)
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true

# --- BUILD ---
build:fsi-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t interop-fsi:$CI_COMMIT_SHORT_SHA docker/fsi-job/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual
  allow_failure: true

# --- DEPLOY STAGE ---
deploy:stage:databricks:
  stage: deploy-stage
  image: python:3.12-slim
  script:
    - echo "Deploy Databricks bundle to stage — requires DATABRICKS_HOST + SP token"
    - test -n "${DATABRICKS_HOST:-}" || (echo "Set CI/CD variables" && exit 1)
    - pip install -q databricks-cli
    - databricks bundle deploy -t stage
  environment:
    name: stage
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

deploy:stage:seiji:
  stage: deploy-stage
  script:
    - echo "Seiji canary deploy to stage EKS — run via Seiji runner with manifest"
    - test -x bin/seiji || echo "Seiji shim not configured"
  environment:
    name: stage
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

# --- DEPLOY PROD ---
deploy:prod:seiji:
  stage: deploy-prod
  script:
    - echo "Production deploy requires manual approval + change ticket"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual

deploy:prod:databricks:
  stage: deploy-prod
  image: python:3.12-slim
  script:
    - pip install -q databricks-cli
    - databricks bundle deploy -t prod
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: manual
