apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-firely
  labels:
    app: firely-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: firely-server
  template:
    metadata:
      labels:
        app: firely-server
    spec:
      containers:
        - name: firely
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 4080
          env:
            - name: Firely__MongoDbConnectionString
              valueFrom:
                secretKeyRef:
                  name: firely-secrets
                  key: mongo-connection-string
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /fhir/metadata
              port: 4080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /fhir/metadata
              port: 4080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-firely
spec:
  selector:
    app: firely-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 4080
  type: {{ .Values.service.type }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-firely
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-firely
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
